# =========================================================================
# docker-compose.yml — Apache Airflow (CeleryExecutor) + Postgres ปลายทาง + เว็บ dashboard
# ปรับจาก workshop_airflow_on_docker (suriyapi) / ไฟล์ quick-start ทางการของ Airflow
#
# วิธีใช้งาน (ดู README.md):
#   1) cp .env.example .env      (Windows: copy .env.example .env)
#   2) docker compose up airflow-init
#   3) docker compose up -d --build
#   4) Airflow   : http://localhost:8080  (user/pass ตาม .env, ค่าเริ่มต้น airflow / airflow)
#      Dashboard : http://localhost:8050
#
# Postgres ปลายทาง (ข้อมูลราคา):
#   - ภายใน docker network: host=postgres_target, port=5432
#   - จากเครื่อง host (DBeaver/pgAdmin): host=localhost, port=5433
# Connection "postgres_target" ของ Airflow สร้างอัตโนมัติจาก AIRFLOW_CONN_POSTGRES_TARGET
# =========================================================================

x-airflow-common:
  &airflow-common
  build: .          # Dockerfile = apache/airflow:2.10.4 + requirements.txt
  image: agri-price-airflow:2.10.4
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Bangkok
    # Connection ไปยัง Postgres ปลายทาง (ไม่ต้องตั้งเองในเมนู Admin -> Connections)
    AIRFLOW_CONN_POSTGRES_TARGET: postgresql://${TARGET_DB_USER:-etluser}:${TARGET_DB_PASSWORD:-etlpass}@postgres_target:5432/${TARGET_DB_NAME:-etl_db}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:

  # Postgres สำหรับ metadata ของ Airflow เอง (แยกจาก DB ปลายทาง)
  postgres:
    image: postgres:16
    container_name: agri_airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-bookworm
    container_name: agri_airflow_redis
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    container_name: agri_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: agri_airflow_scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: agri_airflow_worker
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: agri_airflow_triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    container_name: agri_airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  # Postgres ปลายทางสำหรับข้อมูลราคา (host port 5433 กันชนกับ postgres อื่นในเครื่อง)
  postgres_target:
    image: postgres:16
    container_name: agri_postgres_target
    environment:
      POSTGRES_USER: ${TARGET_DB_USER:-etluser}
      POSTGRES_PASSWORD: ${TARGET_DB_PASSWORD:-etlpass}
      POSTGRES_DB: ${TARGET_DB_NAME:-etl_db}
      TZ: Asia/Bangkok
    ports:
      - "5433:5432"
    volumes:
      - postgres-target-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # เว็บ dashboard (Flask) อ่านข้อมูลจาก PostgreSQL โดยตรง
  web:
    build: ./web
    container_name: agri_web_dashboard
    environment:
      DB_HOST: postgres_target
      DB_PORT: 5432
      DB_NAME: ${TARGET_DB_NAME:-etl_db}
      DB_USER: ${TARGET_DB_USER:-etluser}
      DB_PASSWORD: ${TARGET_DB_PASSWORD:-etlpass}
    ports:
      - "8050:8050"
    depends_on:
      postgres_target:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-db-volume:
  postgres-target-volume:
